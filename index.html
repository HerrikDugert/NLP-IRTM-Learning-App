<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRTM Lernkarten — 85 Karten (Vorlesung, Assignments, Übungen)</title>
<style>
  :root {
    --bg:#0d1020;
    --panel:#1b2140;
    --panel2:#242c52;
    --a:#6f91ff;
    --good:#35c77d;
    --bad:#ff6475;
    --t:#eef1ff;
    --m:#aeb7d7;
    --concept:#ffcf7a;
    --border:#3b4679;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    background:linear-gradient(145deg,#111735,var(--bg));
    color:var(--t);
    font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    padding:22px;
  }
  main {
    max-width:860px;
    margin:auto;
  }
  h1 {
    margin:0;
    text-align:center;
    font-size:1.55rem;
  }
  .sub {
    text-align:center;
    color:var(--m);
    margin:5px 0 18px;
    font-size:.9rem;
  }
  .bar, .nav, .stats {
    display:flex;
    gap:9px;
    align-items:center;
    flex-wrap:wrap;
    justify-content:center;
  }
  button {
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--t);
    border-radius:9px;
    padding:8px 12px;
    cursor:pointer;
    font-size:.86rem;
    transition:background .2s, border-color .2s;
  }
  button:hover { border-color:var(--a); }
  button.active {
    background:var(--a);
    border-color:var(--a);
    font-weight:700;
  }
  .progress {
    height:8px;
    background:#30395f;
    border-radius:9px;
    overflow:hidden;
    flex:1;
    min-width:120px;
  }
  .progress i {
    display:block;
    height:100%;
    background:var(--a);
    transition:.25s;
    width:0%;
  }
  .meta {
    margin:18px 0 8px;
    color:var(--m);
    font-size:.83rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .tags-row {
    display:flex;
    gap:6px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .tag {
    background:#303b70;
    color:#dce4ff;
    border-radius:999px;
    padding:3px 9px;
    font-size:.72rem;
  }
  .tag.src-assignment {
    background:#422e18;
    color:#ffd899;
    border:1px solid #73512b;
  }
  .tag.src-exercise {
    background:#1b422a;
    color:#a9ffd1;
    border:1px solid #2f734a;
  }
  .card {
    min-height:320px;
    background:linear-gradient(150deg,var(--panel),var(--panel2));
    border:1px solid #374270;
    border-radius:17px;
    padding:24px;
    box-shadow:0 12px 34px #0005;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .q {
    font-size:1.1rem;
    line-height:1.55;
    font-weight:500;
  }
  .answer {
    margin-top:16px;
    color:#e2ffe9;
    line-height:1.6;
    padding:12px;
    background:#142d20;
    border:1px solid #2c6e49;
    border-radius:10px;
    font-size:1.02rem;
  }
  .hint {
    display:none;
    margin-top:14px;
    padding:10px;
    border:1px dashed var(--a);
    background:#121832;
    border-radius:9px;
    font-size:.84rem;
    color:#d5dcff;
    line-height:1.45;
  }
  .hint.show { display:block; }
  .concept {
    display:none;
    margin-top:14px;
    padding:12px;
    border:1px solid var(--concept);
    background:#2a220f;
    border-radius:9px;
    font-size:.86rem;
    color:#ffe9bd;
    line-height:1.55;
    white-space:pre-line;
  }
  .concept.show { display:block; }
  .opts {
    display:grid;
    gap:9px;
    margin-top:16px;
  }
  .opt {
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#131932;
    cursor:pointer;
    display:flex;
    gap:9px;
    align-items:flex-start;
    line-height:1.4;
  }
  .opt input {
    margin-top:3px;
    cursor:pointer;
  }
  .opt.good {
    border-color:var(--good);
    background:#1c4b3955;
  }
  .opt.bad {
    border-color:var(--bad);
    background:#5a243055;
  }
  .feedback {
    display:none;
    margin-top:12px;
    padding:10px;
    border-radius:9px;
    font-size:.9rem;
    font-weight:600;
  }
  .feedback.ok {
    display:block;
    background:#1c4b39;
    color:#a9ffd1;
  }
  .feedback.no {
    display:block;
    background:#592832;
    color:#ffd3d9;
  }
  .nav {
    margin-top:15px;
    justify-content:space-between;
  }
  .stats {
    margin-top:18px;
    color:var(--m);
    font-size:.85rem;
    gap:18px;
  }
  .stats b { color:var(--t); }
  .hidden { display:none!important; }
  @media(max-width:520px){
    body { padding:14px; }
    .card { padding:18px; min-height:340px; }
  }
</style>
</head>
<body>
<main>
  <h1>📚 IRTM Lernkarten (85 Karten)</h1>
  <div class="sub">Vollständiges Set: Vorlesungsthemen (48) + Assignments (13) + Folien-Übungen (24)</div>
  <div class="bar">
    <button id="flash" class="active">🃏 Lernkarten</button>
    <button id="mc">✅ Multiple Choice</button>
    <button id="mix">🔀 Mischen</button>
    <button id="reset">♻ Reset</button>
  </div>
  <div class="meta">
    <span id="pos">Karte 1 / 85</span>
    <div class="progress"><i id="prog"></i></div>
  </div>
  <div class="tags-row">
    <span id="topic" class="tag">Thema</span>
    <span id="source" class="tag">Quelle</span>
  </div>
  <section id="card" class="card">
    <div>
      <div id="question" class="q"></div>
      <div id="options" class="opts hidden"></div>
      <div id="feedback" class="feedback"></div>
      <div id="answer" class="answer hidden"></div>
      <div id="concept" class="concept"></div>
      <div id="hint" class="hint"></div>
    </div>
    <div class="bar">
      <button id="hintBtn">💡 Hinweis</button>
      <button id="conceptBtn">🧠 Konzept erklären</button>
      <button id="action">Antwort zeigen</button>
    </div>
  </section>
  <div class="nav">
    <button id="prev">← Zurück</button>
    <button id="next">Weiter →</button>
  </div>
  <div class="stats">
    <span>Gesehen: <b id="seen">0</b>/<b id="total">85</b></span>
    <span>MC richtig: <b id="right">0</b></span>
    <span>MC falsch: <b id="wrong">0</b></span>
  </div>
</main>

const KEY = 'irtm-full-85-v1';
let state = JSON.parse(localStorage.getItem(KEY) || 'null') || {
  order: CARDS.map(c => c.id),
  i: 0,
  mode: 'f',
  flipped: false,
  conceptOpen: false,
  p: {}
};

CARDS.forEach(c => {
  if (!state.p[c.id]) state.p[c.id] = { seen:false, done:false, ok:false, sel:[] };
});
state.order = state.order.filter(id => CARDS.some(c => c.id === id));
CARDS.forEach(c => {
  if (!state.order.includes(c.id)) state.order.push(c.id);
});
if (state.i >= state.order.length) state.i = 0;

const by = Object.fromEntries(CARDS.map(c => [c.id, c]));

const $ = id => document.getElementById(id),
  flash = $('flash'), mc = $('mc'), q = $('question'), a = $('answer'),
  hint = $('hint'), concept = $('concept'), opts = $('options'),
  feedback = $('feedback'), action = $('action');

function cur() {
  return by[state.order[state.i]];
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
}

function renderSourceTag(c) {
  const src = $('source');
  src.className = 'tag';
  if (c.source === 'assignment') {
    src.textContent = '📝 Assignment-Aufgabe';
    src.classList.add('src-assignment');
  } else if (c.source === 'exercise') {
    src.textContent = '🟩 Folien-Übung';
    src.classList.add('src-exercise');
  } else {
    src.textContent = '📘 Vorlesungsfolie';
  }
}

function render() {
  const c = cur(), p = state.p[c.id];
  $('pos').textContent = `Karte ${state.i+1} / ${state.order.length}`;
  $('prog').style.width = ((state.i+1) / state.order.length * 100) + '%';
  $('topic').textContent = c.topic;
  renderSourceTag(c);
  q.textContent = c.q;
  a.textContent = c.a;
  hint.textContent = '📖 ' + c.hint;
  hint.classList.remove('show');
  concept.textContent = '🧠 ' + c.concept;
  concept.classList.toggle('show', state.conceptOpen);
  flash.classList.toggle('active', state.mode === 'f');
  mc.classList.toggle('active', state.mode === 'm');
  opts.innerHTML = '';
  feedback.className = 'feedback';
  a.classList.toggle('hidden', !(state.mode === 'f' && state.flipped));
  opts.classList.toggle('hidden', state.mode !== 'm');
  action.textContent = state.mode === 'f'
    ? (state.flipped ? 'Frage zeigen' : 'Antwort zeigen')
    : (p.done ? 'Erneut versuchen' : 'Prüfen ✓');

  if (state.mode === 'm') {
    c.choices.forEach((ch, idx) => {
      const d = document.createElement('label');
      d.className = 'opt';
      const inp = document.createElement('input');
      inp.type = 'checkbox';
      inp.checked = p.sel.includes(idx);
      inp.disabled = p.done;
      inp.onchange = () => {
        p.sel = inp.checked ? [...new Set([...p.sel, idx])] : p.sel.filter(x => x !== idx);
        save();
      };
      d.append(inp, document.createTextNode(ch.t));
      opts.append(d);
    });
    if (p.done) {
      const correctIndices = c.choices.map((ch, idx) => ch.c ? idx : null).filter(x => x !== null);
      const isGood = JSON.stringify([...p.sel].sort()) === JSON.stringify([...correctIndices].sort());
      [...opts.children].forEach((d, idx) => {
        if (c.choices[idx].c) d.classList.add('good');
        if (p.sel.includes(idx) && !c.choices[idx].c) d.classList.add('bad');
      });
      feedback.textContent = isGood ? '✅ Richtig! Alle korrekten Antworten gefunden.' : '❌ Nicht ganz richtig.';
      feedback.className = 'feedback ' + (isGood ? 'ok' : 'no');
    }
  }

  if (!p.seen) {
    p.seen = true;
    save();
  }

  const ps = Object.values(state.p);
  $('seen').textContent = ps.filter(x => x.seen).length;
  $('total').textContent = CARDS.length;
  $('right').textContent = ps.filter(x => x.done && x.ok).length;
  $('wrong').textContent = ps.filter(x => x.done && !x.ok).length;
}

flash.onclick = () => { state.mode = 'f'; save(); render(); };
mc.onclick = () => { state.mode = 'm'; save(); render(); };
$('hintBtn').onclick = () => hint.classList.toggle('show');
$('conceptBtn').onclick = () => {
  state.conceptOpen = !state.conceptOpen;
  save();
  concept.classList.toggle('show', state.conceptOpen);
};

action.onclick = () => {
  const c = cur(), p = state.p[c.id];
  if (state.mode === 'f') {
    state.flipped = !state.flipped;
  } else if (p.done) {
    p.done = false;
    p.ok = false;
    p.sel = [];
  } else {
    const correctIndices = c.choices.map((ch, idx) => ch.c ? idx : null).filter(x => x !== null);
    p.done = true;
    p.ok = JSON.stringify([...p.sel].sort()) === JSON.stringify([...correctIndices].sort());
  }
  save();
  render();
};

function move(n) {
  state.i = (state.i + n + state.order.length) % state.order.length;
  state.flipped = false;
  state.conceptOpen = false;
  save();
  render();
}

$('prev').onclick = () => move(-1);
$('next').onclick = () => move(1);
$('mix').onclick = () => {
  for (let i = state.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
  }
  state.i = 0;
  save();
  render();
};

$('reset').onclick = () => {
  if (confirm('Gesamten Fortschritt der 85 Lernkarten zurücksetzen?')) {
    state = {
      order: CARDS.map(c => c.id),
      i: 0,
      mode: 'f',
      flipped: false,
      conceptOpen: false,
      p: {}
    };
    CARDS.forEach(c => state.p[c.id] = { seen:false, done:false, ok:false, sel:[] });
    save();
    render();
  }
};

document.onkeydown = e => {
  if (e.key === 'ArrowLeft') move(-1);
  if (e.key === 'ArrowRight') move(1);
  if (e.key === ' ' && state.mode === 'f') {
    e.preventDefault();
    state.flipped = !state.flipped;
    save();
    render();
  }
};

render();
</script>
